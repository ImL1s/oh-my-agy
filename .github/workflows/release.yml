name: release-verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify immutable release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:package
      - run: npm run test:e2e
      - run: npm run smoke
      - name: Verify tag and manifest versions
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          PLUGIN="$(node -p "require('./plugin.json').version")"
          MARKET="$(node -p "require('./.claude-plugin/plugin.json').version")"
          test "$PKG" = "$PLUGIN"
          test "$PKG" = "$MARKET"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$PKG"
          fi
      - name: Verify package readback surface
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -E 'dist/bin/oma\.js' pack.txt
          grep -E 'dist/src/mcp/server\.js' pack.txt
          grep -E 'dist/src/workflows/runner\.js' pack.txt
          grep -E 'scripts/install\.sh' pack.txt
          grep -E '\.mcp\.json' pack.txt
          grep -E '\.agents/workflows/production-safety-review\.md' pack.txt
          grep -E 'skills/workflow/SKILL\.md' pack.txt
          grep -E 'tests/fixtures/workflow/production-safety-review-v1\.json' pack.txt
          grep -E 'docs/RELEASE\.md' pack.txt
          grep -E 'docs/capabilities\.md' pack.txt
          grep -E 'docs/security\.md' pack.txt
          grep -E 'docs/workflows\.md' pack.txt
      - name: Verify live production gate fails closed without evidence
        run: |
          set -euo pipefail
          if npm run test:production > production.txt 2>&1; then
            echo 'production gate unexpectedly passed without live evidence' >&2
            exit 1
          fi
          grep -E 'E_PRODUCTION_EVIDENCE' production.txt
