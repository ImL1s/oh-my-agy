name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Build + unit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Version sync public manifests
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json","utf8"));
            const plug = JSON.parse(fs.readFileSync("plugin.json","utf8"));
            const claude = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json","utf8"));
            const market = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json","utf8"));
            const entry = (market.plugins || []).find((p) => p.name === "oh-my-agy");
            if (
              pkg.version !== plug.version
              || pkg.version !== claude.version
              || pkg.version !== market.version
              || !entry
              || entry.version !== pkg.version
            ) {
              console.error("version mismatch", pkg.version, plug.version, claude.version, market.version, entry && entry.version);
              process.exit(1);
            }
            console.log("version", pkg.version);
          '
      - run: npm run test:unit
      - run: npm run test:package
      - name: npm pack must include hooks
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -E 'dist/src/hooks/pre-invocation\.js' pack.txt
          grep -E 'dist/src/hooks/stop\.js' pack.txt
          grep -E 'plugin\.json' pack.txt
          grep -E 'hooks\.json' pack.txt
          grep -E '\.mcp\.json' pack.txt
          grep -E 'scripts/install\.sh' pack.txt
          grep -E '\.agents/workflows/production-safety-review\.md' pack.txt
          grep -E 'skills/workflow/SKILL\.md' pack.txt
          grep -E 'docs/RELEASE\.md' pack.txt
          grep -E 'docs/security\.md' pack.txt

  e2e:
    name: E2E (mock agy)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
